<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 4: Co-sign loans</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--ink:#ffffff;--mute:rgba(255,255,255,0.72);--dim:rgba(255,255,255,0.56);--rule:rgba(255,255,255,0.12);--rule-strong:rgba(255,255,255,0.32);--key:#627eea;--bar:#5c5e60;--loss:#e5484d;--font-display:'General Sans','Aeonik Pro','Inter',system-ui,sans-serif;--font-body:'Inter',system-ui,-apple-system,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;--type-body-lg:400 18px/1.56 var(--font-body);--type-body-sm:400 14px/1.43 var(--font-body)}
body{margin:0;background:#000000}
a{color:#ffffff;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>

<div style="min-height: 1080px; background: #000000; color: var(--ink); font-family: var(--font-body)">

  <dc-import name="StepNav" step="4" hint-size="100%,120px"></dc-import>

  <div style="display: flex; flex-direction: row-reverse; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 48px 64px; padding: 40px 48px 64px">
    <aside aria-label="Who acts on this screen" style="flex: 1 1 280px; max-width: 320px; display: flex; flex-direction: column; align-items: flex-end; gap: 20px">
      <dc-import name="Role" role="broker" who="Broker and borrowers" action="{{roleAction}}" hint-size="320px,220px"></dc-import>
      <div role="group" aria-label="Loan" style="display: inline-flex; padding: 4px; border-radius: 9999px; border: 1px solid var(--rule)">
        <button type="button" aria-pressed="{{isA}}" onClick="{{pickA}}" style="{{tabA}}">Loan A</button>
        <button type="button" aria-pressed="{{isB}}" onClick="{{pickB}}" style="{{tabB}}">Loan B</button>
      </div>
    </aside>

  <main style="flex: 999 1 560px; min-width: 0; max-width: 820px; display: flex; flex-direction: column; gap: 48px">

    <div style="display: flex; flex-wrap: wrap; gap: 32px 56px">
      <dc-import name="Value" label="Principal" amount="{{principal}}" visibility="decrypted" hint-size="240px,64px"></dc-import>
      <div style="display: inline-flex; flex-direction: column; gap: 4px">
        <span style="font: var(--type-body-sm); color: var(--mute)">Interest rate</span>
        <span style="font: 500 20px/1.2 var(--font-body); color: var(--key)">{{rate}}</span>
      </div>
      <dc-import name="Value" label="Periodic payment" amount="{{periodic}}" visibility="decrypted" hint-size="240px,64px"></dc-import>
      <dc-import name="Value" label="Amount owed" amount="{{owed}}" visibility="decrypted" hint-size="240px,64px"></dc-import>
    </div>

    <section aria-labelledby="terms" style="display: flex; flex-direction: column; gap: 20px">
      <h2 id="terms" style="margin: 0; font: 500 20px/1.4 var(--font-display)">Schedule</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 24px 40px">
        <label style="flex: 1 1 140px; display: flex; flex-direction: column; gap: 6px; font: var(--type-body-sm); color: var(--mute)">Payment interval
          <input type="text" value="[interval]" style="width: 100%; box-sizing: border-box; height: 52px; padding: 0; border: 0; border-bottom: 1px solid var(--rule-strong); background: transparent; color: var(--ink); font: 500 24px/1 var(--font-display)">
        </label>
        <label style="flex: 1 1 140px; display: flex; flex-direction: column; gap: 6px; font: var(--type-body-sm); color: var(--mute)">Payments
          <input type="text" value="1" style="width: 100%; box-sizing: border-box; height: 52px; padding: 0; border: 0; border-bottom: 1px solid var(--rule-strong); background: transparent; color: var(--ink); font: 500 24px/1 var(--font-display)">
        </label>
        <label style="flex: 1 1 140px; display: flex; flex-direction: column; gap: 6px; font: var(--type-body-sm); color: var(--mute)">Grace period
          <input type="text" value="[grace period]" style="width: 100%; box-sizing: border-box; height: 52px; padding: 0; border: 0; border-bottom: 1px solid var(--rule-strong); background: transparent; color: var(--ink); font: 500 24px/1 var(--font-display)">
        </label>
      </div>
    </section>

    <section aria-labelledby="handoff" style="display: flex; flex-direction: column; gap: 20px">
      <h2 id="handoff" style="margin: 0; font: 500 20px/1.4 var(--font-display)">Signatures</h2>
      <ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
        <li style="display: flex; flex-direction: column; gap: 10px"><span style="{{bar1}}"></span><span style="font: 500 16px/1.3 var(--font-body)">Broker signs</span><span style="font: var(--type-body-sm); color: var(--mute)">{{note1}}</span></li>
        <li style="display: flex; flex-direction: column; gap: 10px"><span style="{{bar2}}"></span><span style="font: 500 16px/1.3 var(--font-body)">{{borrower}} co-signs</span><span style="font: var(--type-body-sm); color: var(--mute)">{{note2}}</span></li>
        <li style="display: flex; flex-direction: column; gap: 10px"><span style="{{bar3}}"></span><span style="font: 500 16px/1.3 var(--font-body)">LoanSet</span><span style="font: var(--type-body-sm); color: var(--mute)">{{note3}}</span></li>
      </ol>
      <button type="button" onClick="{{advance}}" style="align-self: flex-start; min-height: 52px; padding: 0 28px; border: 0; border-radius: 9999px; background: #ffffff; color: #000000; font: 600 16px/1 var(--font-body); letter-spacing: 0.24px; cursor: pointer">{{cta}}</button>
    </section>

    <a href="05-explorer-loans.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 9999px; border: 1px solid var(--rule-strong); font: 500 14px/1 var(--font-body)">Continue to step 5</a>
  </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const loan = s.loan || 'A';
    const stage = s.stage || 0;
    const borrower = loan === 'A' ? 'Borrower A' : 'Borrower B';
    const on = { minHeight: '40px', padding: '0 18px', border: 0, borderRadius: '9999px', background: '#ffffff', color: '#000000', font: '600 14px/1 var(--font-body)', cursor: 'pointer' };
    const off = { minHeight: '40px', padding: '0 18px', border: 0, borderRadius: '9999px', background: 'transparent', color: 'rgba(255,255,255,0.72)', font: '500 14px/1 var(--font-body)', cursor: 'pointer' };
    const bar = (i) => ({ height: '3px', background: stage > i ? '#ffffff' : stage === i ? 'rgba(255,255,255,0.48)' : 'rgba(255,255,255,0.16)' });
    const ctas = ['Sign as Broker', 'Co-sign as ' + borrower, 'Start loan ' + (loan === 'A' ? 'B' : 'A')];
    return {
      borrower,
      principal: loan === 'A' ? '[principal A]' : '[principal B]',
      rate: loan === 'A' ? '[rate A]' : '[rate B]',
      periodic: loan === 'A' ? '[periodic payment A]' : '[periodic payment B]',
      roleAction: 'Co-sign loan ' + loan + ' with ' + borrower,
      owed: loan === 'A' ? '[amount owed A]' : '[amount owed B]',
      isA: loan === 'A' ? 'true' : 'false',
      isB: loan === 'B' ? 'true' : 'false',
      tabA: loan === 'A' ? on : off,
      tabB: loan === 'B' ? on : off,
      pickA: () => this.setState({ loan: 'A', stage: 0 }),
      pickB: () => this.setState({ loan: 'B', stage: 0 }),
      bar1: bar(0),
      bar2: bar(1),
      bar3: bar(2),
      note1: stage > 0 ? 'Signed' : 'Waiting',
      note2: stage > 1 ? 'Co-signed' : stage === 1 ? 'Signing now' : 'Waiting',
      note3: stage > 1 ? 'Principal sent to ' + borrower : 'Needs both signatures',
      cta: ctas[stage],
      advance: () => {
        if (stage < 2) this.setState({ stage: stage + 1 });
        else this.setState({ loan: loan === 'A' ? 'B' : 'A', stage: 0 });
      }
    };
  }
}
</script>
</body>
</html>
