<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 7: Settle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--ink:#ffffff;--mute:rgba(255,255,255,0.72);--dim:rgba(255,255,255,0.56);--rule:rgba(255,255,255,0.12);--rule-strong:rgba(255,255,255,0.32);--key:#627eea;--bar:#5c5e60;--loss:#e5484d;--font-display:'General Sans','Aeonik Pro','Inter',system-ui,sans-serif;--font-body:'Inter',system-ui,-apple-system,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;--type-body-lg:400 18px/1.56 var(--font-body);--type-body-sm:400 14px/1.43 var(--font-body)}
body{margin:0;background:#000000}
a{color:#ffffff;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="min-height: 1080px; background: #000000; color: var(--ink); font-family: var(--font-body)">

  <dc-import name="StepNav" step="7" hint-size="100%,120px"></dc-import>

  <div style="display: flex; flex-direction: row-reverse; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 48px 64px; padding: 40px 48px 64px">
    <aside aria-label="Role" style="flex: 1 1 280px; max-width: 320px; display: flex; flex-direction: column; align-items: flex-end">
      <dc-import name="Role" role="broker" who="Broker A" action="Merges the inbox, then settles the Lending Balance to the vault" hint-size="320px,220px"></dc-import>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; max-width: 820px; display: flex; flex-direction: column; gap: 48px">
      <section aria-labelledby="book" style="display: flex; flex-direction: column">
        <h2 id="book" style="margin: 0 0 16px; font: 500 20px/1.4 var(--font-display)">Repayments received</h2>
        <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px 32px; padding: 20px 0; border-top: 1px solid var(--rule)">
          <span style="flex: 1 1 200px; font: 500 16px/1.4 var(--font-body)">Loan A, Borrower A</span>
          <span style="flex: 1 1 200px"><dc-import name="Value" label="Paid in full" amount="[paid A]" visibility="decrypted" hint-size="240px,64px"></dc-import></span>
        </div>
        <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px 32px; padding: 20px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule)">
          <span style="flex: 1 1 200px; font: 500 16px/1.4 var(--font-body)">Loan B, Borrower B</span>
          <span style="flex: 1 1 200px; font: 500 16px/1.4 var(--font-body); color: var(--dim)">No payment yet</span>
        </div>
      </section>

      <div style="display: flex; align-items: flex-end; flex-wrap: wrap; gap: 24px 40px">
        <dc-import name="Value" label="Lending Balance" amount="[lending balance]" visibility="decrypted" hint-size="240px,64px"></dc-import>
        <span style="padding-bottom: 8px; color: var(--dim); display: flex"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></span>
        <dc-import name="Value" label="Vault, available" amount="[available]" visibility="public" hint-size="240px,64px"></dc-import>
      </div>

      <section aria-labelledby="settle" style="display: flex; flex-direction: column; gap: 20px">
        <h2 id="settle" style="margin: 0; font: 500 20px/1.4 var(--font-display)">Settle</h2>
        <dc-import name="Value" label="Amount settled" amount="[settled amount]" visibility="public" hint-size="240px,64px"></dc-import>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
          <button type="button" style="min-height: 52px; padding: 0 28px; border: 1px solid var(--rule-strong); border-radius: 9999px; background: transparent; color: var(--ink); font: 600 16px/1 var(--font-body); letter-spacing: 0.24px; cursor: pointer">1. Merge inbox</button>
          <span aria-hidden="true" style="display: flex; color: var(--dim)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></span>
          <button type="button" style="min-height: 52px; padding: 0 28px; border: 0; border-radius: 9999px; background: #ffffff; color: #000000; font: 600 16px/1 var(--font-body); letter-spacing: 0.24px; cursor: pointer">2. Settle to vault</button>
        </div>
      </section>

      <a href="08-impair-default.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 9999px; border: 1px solid var(--rule-strong); font: 500 14px/1 var(--font-body)">Continue to step 8</a>
    </main>
  </div>
</div>
</x-dc>

  renderVals() {

  }

</script>
</body>
</html>
