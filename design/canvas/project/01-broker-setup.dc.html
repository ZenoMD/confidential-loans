<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 1: Create the confidential LoanBroker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--ink:#ffffff;--mute:rgba(255,255,255,0.72);--dim:rgba(255,255,255,0.56);--rule:rgba(255,255,255,0.12);--rule-strong:rgba(255,255,255,0.32);--key:#627eea;--bar:#5c5e60;--loss:#e5484d;--font-display:'General Sans','Aeonik Pro','Inter',system-ui,sans-serif;--font-body:'Inter',system-ui,-apple-system,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;--type-body-lg:400 18px/1.56 var(--font-body);--type-body-sm:400 14px/1.43 var(--font-body)}
body{margin:0;background:#000000}
a{color:#ffffff;text-decoration:none}a:hover{color:#ffffff}
input::placeholder{color:rgba(255,255,255,0.56);opacity:1}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #ffffff;outline-offset:3px}
</style>
</helmet>
<div style="min-height: 1080px; background: #000000; color: var(--ink); font-family: var(--font-body)">
  <dc-import name="StepNav" step="1" hint-size="100%,120px"></dc-import>

  <div style="display: flex; flex-direction: row-reverse; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 48px 64px; padding: 40px 48px 64px">
    <aside aria-label="Role" style="flex: 1 1 280px; max-width: 320px; display: flex; flex-direction: column; align-items: flex-end">
      <dc-import name="Role" role="broker" who="Broker A" action="Creates the confidential LoanBroker" hint-size="320px,220px"></dc-import>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; max-width: 820px; display: flex; flex-direction: column; gap: 48px">

      <section aria-labelledby="key" style="display: flex; flex-direction: column; gap: 12px">
        <h2 id="key" style="margin: 0; font: 500 20px/1.4 var(--font-display)">Broker key</h2>
        <span style="font: 400 14px/1.4 var(--font-mono); color: var(--mute); overflow-wrap: anywhere">HolderEncryptionKey [33-byte public key]</span>
        <span style="font: 400 14px/1.4 var(--font-mono); color: var(--mute); overflow-wrap: anywhere">ZKProof [64-byte proof]</span>
      </section>

      <section aria-labelledby="terms" style="display: flex; flex-direction: column; gap: 20px">
        <h2 id="terms" style="margin: 0; font: 500 20px/1.4 var(--font-display)">Terms</h2>
        <label style="display: flex; flex-direction: column; gap: 6px; max-width: 420px; font: var(--type-body-sm); color: var(--mute)">Debt maximum
          <span style="display: flex; align-items: baseline; gap: 4px; border-bottom: 1px solid var(--rule-strong)">
            <span aria-hidden="true" style="font: 500 40px/1 var(--font-display); color: var(--dim)">$</span>
            <input type="text" placeholder="[debt maximum]" style="width: 100%; box-sizing: border-box; height: 64px; padding: 0; border: 0; background: transparent; color: var(--ink); font: 500 40px/1 var(--font-display); letter-spacing: -0.4px">
          </span>
        </label>
        <dl style="margin: 0; display: flex; flex-wrap: wrap; gap: 16px 48px">
          <div><dt style="font: var(--type-body-sm); color: var(--mute)">Management fee</dt><dd style="margin: 4px 0 0; font: 500 20px/1.4 var(--font-display)">None</dd></div>
          <div><dt style="font: var(--type-body-sm); color: var(--mute)">First-loss cover</dt><dd style="margin: 4px 0 0; font: 500 20px/1.4 var(--font-display)">None</dd></div>
        </dl>
      </section>

      <button type="button" style="align-self: flex-start; min-height: 52px; padding: 0 28px; border: 0; border-radius: 9999px; background: #ffffff; color: #000000; font: 600 16px/1 var(--font-body); letter-spacing: 0.24px; cursor: pointer">Create confidential LoanBroker</button>

      <a href="02-deposit.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 9999px; border: 1px solid var(--rule-strong); font: 500 14px/1 var(--font-body)">Continue to step 2</a>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
