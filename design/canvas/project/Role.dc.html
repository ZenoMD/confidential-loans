<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Role</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--ink:#ffffff;--mute:rgba(255,255,255,0.72);--dim:rgba(255,255,255,0.56);--rule:rgba(255,255,255,0.12);--rule-strong:rgba(255,255,255,0.32);--key:#627eea;--bar:#5c5e60;--font-display:'General Sans','Aeonik Pro','Inter',system-ui,sans-serif;--font-body:'Inter',system-ui,-apple-system,sans-serif;--type-body-sm:400 14px/1.43 var(--font-body)}
body{margin:0;background:#000000}
a{color:#ffffff;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 320px; max-width: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: flex-end; gap: 16px; text-align: right; background: #000000; color: var(--ink); font-family: var(--font-body)">
  <span aria-hidden="true" style="display: flex"><sc-if value="{{isBroker}}" hint-placeholder-val="{{ false }}"><svg width="64" height="64" viewBox="0 0 48 48" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18L24 7l18 11H6z"></path><path d="M8 21h32M12 21v13M20 21v13M28 21v13M36 21v13M8 37h32M6 41h36"></path></svg></sc-if><sc-if value="{{isDepositor}}" hint-placeholder-val="{{ false }}"><svg width="64" height="64" viewBox="0 0 48 48" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="20" width="32" height="18" rx="2"></rect><circle cx="20" cy="29" r="4"></circle><path d="M8 16h32v18M12 12h32v18"></path></svg></sc-if><sc-if value="{{isBorrower}}" hint-placeholder-val="{{ false }}"><svg width="64" height="64" viewBox="0 0 48 48" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16l4-8h28l4 8"></path><path d="M6 16q4.5 6 9 0q4.5 6 9 0q4.5 6 9 0q4.5 6 9 0"></path><path d="M10 21v20M38 21v20M8 41h32M10 31h28"></path><circle cx="17" cy="28" r="3"></circle><circle cx="24" cy="28" r="3"></circle><circle cx="31" cy="28" r="3"></circle></svg></sc-if><sc-if value="{{isExplorer}}" hint-placeholder-val="{{ false }}"><svg width="64" height="64" viewBox="0 0 48 48" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="21" cy="21" r="12"></circle><path d="M30 30l11 11"></path></svg></sc-if></span>
  <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 10px">
    <h1 style="margin: 0; font: 500 32px/1.15 var(--font-display); letter-spacing: -0.32px">{{who}}</h1>
    <p style="margin: 0; font: 400 18px/1.56 var(--font-body); color: var(--mute)">{{action}}</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","default":"broker","options":["broker","depositor","borrower","explorer"]},"who":{"editor":"text","default":"Broker"},"action":{"editor":"text","default":"Creates the confidential LoanBroker"},"$preview":{"width":320,"height":220}}'>
class Component extends DCLogic {
  renderVals() {
    const role = this.props.role ?? 'broker';
    return {
      isBroker: role === 'broker',
      isDepositor: role === 'depositor',
      isBorrower: role === 'borrower',
      isExplorer: role === 'explorer',
      who: this.props.who ?? 'Broker',
      action: this.props.action ?? ''
    };
  }
}
</script>
</body>
</html>
