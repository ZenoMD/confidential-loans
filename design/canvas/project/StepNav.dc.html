<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--ink:#ffffff;--mute:rgba(255,255,255,0.72);--dim:rgba(255,255,255,0.56);--rule:rgba(255,255,255,0.12);--rule-strong:rgba(255,255,255,0.32);--key:#627eea;--bar:#5c5e60;--font-display:'General Sans','Aeonik Pro','Inter',system-ui,sans-serif;--font-body:'Inter',system-ui,-apple-system,sans-serif;--type-body-sm:400 14px/1.43 var(--font-body)}
body{margin:0;background:#000000}
a{color:#ffffff;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<header style="background: #000000; color: var(--ink); font-family: var(--font-body)">
  <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 32px; padding: 20px 48px 0">
    <a href="Main.dc.html" style="display: flex; align-items: baseline; gap: 12px"><span style="font: 500 22px/1 var(--font-display); letter-spacing: -0.3px">zeno<span style="color: var(--key)">.</span></span><span style="font: var(--type-body-sm); color: var(--mute)">Confidential Loans</span></a>
    <sc-if value="{{hasPhase}}" hint-placeholder-val="{{ true }}"><span style="font: var(--type-body-sm); color: var(--ink)">{{phase}}</span></sc-if>
  </div>
  <nav aria-label="Demo steps" style="padding: 28px 48px 0">
    <ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="10">
        <li><a href="{{it.href}}" aria-current="{{it.current}}" aria-label="{{it.aria}}" style="{{it.linkStyle}}"><span aria-hidden="true" style="display: flex; gap: 4px; height: 16px"><sc-for list="{{it.icons}}" as="ic" hint-placeholder-count="1"><sc-if value="{{ic.broker}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18L24 7l18 11H6z"></path><path d="M8 21h32M12 21v13M20 21v13M28 21v13M36 21v13M8 37h32M6 41h36"></path></svg></sc-if><sc-if value="{{ic.depositor}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="20" width="32" height="18" rx="2"></rect><circle cx="20" cy="29" r="4"></circle><path d="M8 16h32v18M12 12h32v18"></path></svg></sc-if><sc-if value="{{ic.borrower}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16l4-8h28l4 8"></path><path d="M6 16q4.5 6 9 0q4.5 6 9 0q4.5 6 9 0q4.5 6 9 0"></path><path d="M10 21v20M38 21v20M8 41h32M10 31h28"></path><circle cx="17" cy="28" r="3"></circle><circle cx="24" cy="28" r="3"></circle><circle cx="31" cy="28" r="3"></circle></svg></sc-if><sc-if value="{{ic.explorer}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="21" cy="21" r="12"></circle><path d="M30 30l11 11"></path></svg></sc-if></sc-for></span><span style="{{it.barStyle}}"></span><span style="{{it.textStyle}}">{{it.text}}</span></a></li>
      </sc-for>
    </ol>
  </nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"int","default":0,"min":0,"max":10},"$preview":{"width":1280,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    const step = Number(this.props.step ?? 0);
    const steps = [{"n": 1, "href": "01-broker-setup.dc.html", "label": "Create broker", "icons": ["broker"]}, {"n": 2, "href": "02-deposit.dc.html", "label": "Subscribe", "icons": ["depositor"]}, {"n": 3, "href": "03-draw.dc.html", "label": "Draw and merge", "icons": ["broker"]}, {"n": 4, "href": "04-originate.dc.html", "label": "Co-sign loans", "icons": ["broker", "borrower"]}, {"n": 5, "href": "05-explorer-loans.dc.html", "label": "Explorer", "icons": ["explorer"]}, {"n": 6, "href": "06-repay.dc.html", "label": "Repay loan A", "icons": ["borrower"]}, {"n": 7, "href": "07-settle.dc.html", "label": "Settle", "icons": ["broker"]}, {"n": 8, "href": "08-impair-default.dc.html", "label": "Default loan B", "icons": ["broker"]}, {"n": 9, "href": "09-explorer-default.dc.html", "label": "Explorer after default", "icons": ["explorer"]}, {"n": 10, "href": "10-redeem.dc.html", "label": "Redeem", "icons": ["depositor"]}];
    const items = steps.map((s) => {
      const state = s.n < step ? 'done' : s.n === step ? 'current' : 'upcoming';
      const color = state === 'done' ? 'rgba(255,255,255,0.72)' : state === 'current' ? '#ffffff' : 'rgba(255,255,255,0.56)';
      const bar = state === 'done' ? 'rgba(255,255,255,0.48)' : state === 'current' ? '#ffffff' : 'rgba(255,255,255,0.16)';
      return {
        href: s.href,
        current: state === 'current' ? 'page' : 'false',
        aria: 'Step ' + s.n + (state === 'upcoming' ? '' : ', ' + state) + ': ' + s.label,
        text: state === 'current' ? s.n + ' ' + s.label : String(s.n),
        linkStyle: 'display: flex; flex-direction: column; gap: 8px; min-height: 44px; color: ' + color,
        barStyle: 'height: 3px; background: ' + bar,
        textStyle: 'font: ' + (state === 'current' ? '600 13px/1.3' : '500 13px/1') + ' var(--font-body)',
        icons: s.icons.map((k) => ({ broker: k === 'broker', depositor: k === 'depositor', borrower: k === 'borrower', explorer: k === 'explorer' }))
      };
    });
    const phase = step >= 10 ? 'Redemption' : step >= 3 ? 'Investment' : step >= 1 ? 'Subscription' : '';
    return { items, phase, hasPhase: phase !== '' };
  }
}
</script>
</body>
</html>
