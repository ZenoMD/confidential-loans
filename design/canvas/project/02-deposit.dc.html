<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 2: Subscribe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--ink:#ffffff;--mute:rgba(255,255,255,0.72);--dim:rgba(255,255,255,0.56);--rule:rgba(255,255,255,0.12);--rule-strong:rgba(255,255,255,0.32);--key:#627eea;--bar:#5c5e60;--loss:#e5484d;--font-display:'General Sans','Aeonik Pro','Inter',system-ui,sans-serif;--font-body:'Inter',system-ui,-apple-system,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;--type-body-lg:400 18px/1.56 var(--font-body);--type-body-sm:400 14px/1.43 var(--font-body)}
body{margin:0;background:#000000}
a{color:#ffffff;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="min-height: 1080px; background: #000000; color: var(--ink); font-family: var(--font-body)">

  <dc-import name="StepNav" step="2" hint-size="100%,120px"></dc-import>

  <div style="display: flex; flex-direction: row-reverse; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 48px 64px; padding: 40px 48px 64px">
    <aside aria-label="Role" style="flex: 1 1 280px; max-width: 320px; display: flex; flex-direction: column; align-items: flex-end; gap: 24px">
      <dc-import name="Role" role="depositor" who="{{depositorName}}" action="Subscribes with a public deposit" hint-size="320px,220px"></dc-import>
      <div role="group" aria-label="Depositor" style="display: inline-flex; padding: 4px; border-radius: 9999px; border: 1px solid var(--rule)">
        <button type="button" aria-pressed="{{isA}}" onClick="{{pickA}}" style="{{tabA}}">Depositor A</button>
        <button type="button" aria-pressed="{{isB}}" onClick="{{pickB}}" style="{{tabB}}">Depositor B</button>
      </div>
    </aside>

  <main style="flex: 999 1 560px; min-width: 0; max-width: 820px; display: flex; flex-direction: column; gap: 40px">

    <dc-import name="Value" label="Wallet" amount="[wallet balance]" visibility="public" hint-size="240px,64px"></dc-import>

    <section aria-labelledby="deposit" style="display: flex; flex-direction: column; gap: 16px">
      <h2 id="deposit" style="margin: 0; font: 500 20px/1.4 var(--font-display)">Deposit</h2>
      <div style="display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; max-width: 560px">
        <div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 6px">
          <label for="deposit-amount" style="font: var(--type-body-sm); color: var(--mute)">Deposit amount</label>
          <div style="display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--rule-strong)">
            <span aria-hidden="true" style="font: 500 40px/1 var(--font-display); color: var(--dim)">$</span>
            <input id="deposit-amount" type="text" inputmode="decimal" placeholder="[deposit amount]" style="flex: 1; min-width: 0; box-sizing: border-box; height: 64px; padding: 0; border: 0; background: transparent; color: var(--ink); font: 500 40px/1 var(--font-display); letter-spacing: -0.4px">
          </div>
        </div>
        <button type="button" style="min-height: 44px; padding: 0 18px; border-radius: 9999px; border: 1px solid var(--rule-strong); background: transparent; color: var(--ink); font: 500 14px/1 var(--font-body); cursor: pointer">Max</button>
      </div>
    </section>

    <button type="button" style="align-self: flex-start; min-height: 52px; padding: 0 28px; border: 0; border-radius: 9999px; background: #ffffff; color: #000000; font: 600 16px/1 var(--font-body); letter-spacing: 0.24px; cursor: pointer">Deposit as {{depositorName}}</button>

    <a href="03-draw.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 9999px; border: 1px solid var(--rule-strong); font: 500 14px/1 var(--font-body)">Continue to step 3</a>
  </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const picked = (this.state && this.state.picked) || 'A';
    const on = { minHeight: '40px', padding: '0 18px', border: 0, borderRadius: '9999px', background: '#ffffff', color: '#000000', font: '600 14px/1 var(--font-body)', cursor: 'pointer' };
    const off = { minHeight: '40px', padding: '0 18px', border: 0, borderRadius: '9999px', background: 'transparent', color: 'rgba(255,255,255,0.72)', font: '500 14px/1 var(--font-body)', cursor: 'pointer' };
    return {
      depositorName: picked === 'A' ? 'Depositor A' : 'Depositor B',
      isA: picked === 'A',
      isB: picked === 'B',
      tabA: picked === 'A' ? on : off,
      tabB: picked === 'B' ? on : off,
      pickA: () => this.setState({ picked: 'A' }),
      pickB: () => this.setState({ picked: 'B' })
    };
  }
}
</script>
</body>
</html>
