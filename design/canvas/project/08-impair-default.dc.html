<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 8: Impair and default loan B</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--ink:#ffffff;--mute:rgba(255,255,255,0.72);--dim:rgba(255,255,255,0.56);--rule:rgba(255,255,255,0.12);--rule-strong:rgba(255,255,255,0.32);--key:#627eea;--bar:#5c5e60;--loss:#e5484d;--font-display:'General Sans','Aeonik Pro','Inter',system-ui,sans-serif;--font-body:'Inter',system-ui,-apple-system,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;--type-body-lg:400 18px/1.56 var(--font-body);--type-body-sm:400 14px/1.43 var(--font-body)}
body{margin:0;background:#000000}
a{color:#ffffff;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="min-height: 1080px; background: #000000; color: var(--ink); font-family: var(--font-body)">

  <dc-import name="StepNav" step="8" hint-size="100%,120px"></dc-import>

  <div style="display: flex; flex-direction: row-reverse; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 48px 64px; padding: 40px 48px 64px">
    <aside aria-label="Role" style="flex: 1 1 280px; max-width: 320px; display: flex; flex-direction: column; align-items: flex-end; gap: 32px">
      <dc-import name="Role" role="broker" who="Broker A" action="Impairs loan B, then defaults it" hint-size="320px,220px"></dc-import>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; max-width: 820px; display: flex; flex-direction: column; gap: 48px">
      <div style="display: flex; flex-wrap: wrap; gap: 32px 56px">
        <dc-import name="Value" label="Amount owed" amount="[amount owed B]" visibility="decrypted" hint-size="240px,64px"></dc-import>
        <dc-import name="Value" label="Repaid so far" amount="0" visibility="decrypted" hint-size="240px,64px"></dc-import>
      </div>

      <section aria-labelledby="timeline" style="display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap">
          <h2 id="timeline" style="margin: 0; font: 500 20px/1.4 var(--font-display)">Loan B</h2>
          <span role="status" aria-live="polite" style="{{statusStyle}}">{{status}}</span>
        </div>
        <ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{timeline}}" as="t" hint-placeholder-count="5">
            <li style="display: flex; flex-direction: column; gap: 10px"><span style="{{t.bar}}"></span><span style="font: 500 15px/1.3 var(--font-body)">{{t.label}}</span><span style="font: var(--type-body-sm); color: var(--mute)">{{t.note}}</span></li>
          </sc-for>
        </ol>
        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
          <button type="button" onClick="{{impair}}" disabled="{{impairDisabled}}" style="{{impairBtn}}">Impair loan B</button>
          <button type="button" onClick="{{doDefault}}" disabled="{{defaultDisabled}}" style="{{defaultBtn}}">{{defaultLabel}}</button>
        </div>
      </section>

      <sc-if value="{{isDefaulted}}" hint-placeholder-val="{{ true }}">
      <section aria-labelledby="effect" style="display: flex; flex-direction: column; gap: 16px">
        <h2 id="effect" style="margin: 0; font: 500 20px/1.4 var(--font-display)">Default result</h2>
        <dc-import name="Value" label="Shortfall" amount="[shortfall B]" visibility="decrypted" hint-size="240px,64px"></dc-import>
        <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 24px; padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule)"><span style="font: var(--type-body-sm); color: var(--mute)">Shortfall carried by</span><span style="font: 400 15px/1.4 var(--font-body); color: var(--loss)">Depositors</span></div>
      </section>
      </sc-if>

      <a href="09-explorer-default.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 9999px; border: 1px solid var(--rule-strong); font: 500 14px/1 var(--font-body)">Continue to step 9</a>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const stage = (this.state && this.state.stage) || 0;
    const points = [
      ['Started', 'Loan B active', 0],
      ['Payment due', 'Missed', 0],
      ['Impaired', stage > 0 ? 'Marked late' : 'Available now', 1],
      ['Grace ends', stage > 1 ? 'Passed' : 'After the due date', 2],
      ['Defaulted', stage > 1 ? 'Shortfall to depositors' : 'After grace ends', 2]
    ];
    const timeline = points.map(([label, note, need], i) => ({
      label, note,
      bar: { height: '3px', background: stage >= need ? (i === 4 ? '#e5484d' : '#ffffff') : 'rgba(255,255,255,0.16)' }
    }));
    const primary = { minHeight: '52px', padding: '0 28px', border: 0, borderRadius: '9999px', background: '#ffffff', color: '#000000', font: '600 16px/1 var(--font-body)', letterSpacing: '0.24px', cursor: 'pointer' };
    const muted = { minHeight: '52px', padding: '0 28px', border: '1px solid rgba(255,255,255,0.32)', borderRadius: '9999px', background: 'transparent', color: 'rgba(255,255,255,0.56)', font: '500 16px/1 var(--font-body)', cursor: 'not-allowed' };
    const statuses = ['Overdue', 'Impaired, grace period running', 'Defaulted'];
    return {
      timeline,
      status: statuses[stage],
      statusStyle: { font: '500 14px/1.4 var(--font-body)', color: stage === 2 ? '#e5484d' : 'rgba(255,255,255,0.72)' },
      isDefaulted: stage === 2,
      impairDisabled: stage !== 0,
      impairBtn: stage === 0 ? primary : muted,
      defaultDisabled: stage !== 1,
      defaultBtn: stage === 1 ? primary : muted,
      defaultLabel: stage === 2 ? 'Defaulted' : 'Default loan B',
      impair: () => this.setState({ stage: 1 }),
      doDefault: () => this.setState({ stage: 2 })
    };
  }
}
</script>
</body>
</html>
