<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 3: Draw and merge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--ink:#ffffff;--mute:rgba(255,255,255,0.72);--dim:rgba(255,255,255,0.56);--rule:rgba(255,255,255,0.12);--rule-strong:rgba(255,255,255,0.32);--key:#627eea;--bar:#5c5e60;--loss:#e5484d;--font-display:'General Sans','Aeonik Pro','Inter',system-ui,sans-serif;--font-body:'Inter',system-ui,-apple-system,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;--type-body-lg:400 18px/1.56 var(--font-body);--type-body-sm:400 14px/1.43 var(--font-body)}
body{margin:0;background:#000000}
a{color:#ffffff;text-decoration:none}a:hover{color:#ffffff}
input::placeholder{color:rgba(255,255,255,0.56);opacity:1}
</style>
</helmet>
<div style="min-height: 1080px; background: #000000; color: var(--ink); font-family: var(--font-body)">

  <dc-import name="StepNav" step="3" hint-size="100%,120px"></dc-import>

  <div style="display: flex; flex-direction: row-reverse; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 48px 64px; padding: 40px 48px 64px">
    <aside aria-label="Who acts on this screen" style="flex: 1 1 280px; max-width: 320px; display: flex; flex-direction: column; align-items: flex-end; gap: 32px">
      <dc-import name="Role" role="broker" who="Broker A" action="Draws from the vault, then merges the inbox" hint-size="320px,220px"></dc-import>
    </aside>

  <main style="flex: 999 1 560px; min-width: 0; max-width: 820px; display: flex; flex-direction: column; gap: 48px">

    <div style="display: flex; align-items: flex-end; flex-wrap: wrap; gap: 24px 32px">
      <dc-import name="Value" label="Vault, available" amount="{{vault}}" visibility="public" hint-size="240px,64px"></dc-import>
      <span style="padding-bottom: 8px; color: var(--dim); display: flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></span>
      <dc-import name="Value" label="Lending Balance inbox" amount="{{inbox}}" visibility="decrypted" hint-size="240px,64px"></dc-import>
      <span style="padding-bottom: 8px; color: var(--dim); display: flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></span>
      <dc-import name="Value" label="Lending Balance, spendable" amount="{{spending}}" visibility="decrypted" hint-size="240px,64px"></dc-import>
    </div>

    <section aria-labelledby="draw" style="display: flex; flex-direction: column; gap: 16px">
      <h2 id="draw" style="margin: 0; font: 500 20px/1.4 var(--font-display)">Draw</h2>
      <label style="display: flex; flex-direction: column; gap: 6px; max-width: 560px; font: var(--type-body-sm); color: var(--mute)">Amount drawn
        <input type="text" placeholder="$[drawn]" style="width: 100%; box-sizing: border-box; height: 64px; padding: 0; border: 0; border-bottom: 1px solid var(--rule-strong); background: transparent; color: var(--ink); font: 500 40px/1 var(--font-display); letter-spacing: -0.4px">
      </label>
    </section>

    <section aria-labelledby="steps" style="display: flex; flex-direction: column; gap: 20px">
      <h2 id="steps" style="margin: 0; font: 500 20px/1.4 var(--font-display)">Two transactions</h2>
      <ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: 640px">
        <li style="display: flex; flex-direction: column; gap: 10px"><span aria-hidden="true" style="{{bar1}}"></span><span style="font: 500 16px/1.3 var(--font-body)">Draw from the vault</span><span style="font: var(--type-body-sm); color: var(--mute)">LoanBrokerDraw</span></li>
        <li style="display: flex; flex-direction: column; gap: 10px"><span aria-hidden="true" style="{{bar2}}"></span><span style="font: 500 16px/1.3 var(--font-body)">Merge into spending</span><span style="font: var(--type-body-sm); color: var(--mute)">LoanBrokerMergeInbox</span></li>
      </ol>
      <button type="button" onClick="{{advance}}" style="align-self: flex-start; min-height: 52px; padding: 0 28px; border: 0; border-radius: 9999px; background: #ffffff; color: #000000; font: 600 16px/1 var(--font-body); letter-spacing: 0.24px; cursor: pointer">{{cta}}</button>
    </section>

    <a href="04-originate.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 9999px; border: 1px solid var(--rule-strong); font: 500 14px/1 var(--font-body)">Continue to step 4</a>
  </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const stage = (this.state && this.state.stage) || 0;
    const bar = (i) => ({ height: '3px', background: stage > i ? '#ffffff' : 'rgba(255,255,255,0.16)' });
    const ctas = ['Draw from the vault', 'Merge into spending', 'Done. Run it again'];
    return {
      vault: stage === 0 ? '[available]' : '[available after draw]',
      inbox: stage === 1 ? '[drawn]' : '0',
      spending: stage === 2 ? '[drawn]' : '0',
      bar1: bar(0),
      bar2: bar(1),
      cta: ctas[stage],
      advance: () => this.setState({ stage: stage < 2 ? stage + 1 : 0 })
    };
  }
}
</script>
</body>
</html>
