<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 6: Repay loan A</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--ink:#ffffff;--mute:rgba(255,255,255,0.72);--dim:rgba(255,255,255,0.56);--rule:rgba(255,255,255,0.12);--rule-strong:rgba(255,255,255,0.32);--key:#627eea;--bar:#5c5e60;--loss:#e5484d;--font-display:'General Sans','Aeonik Pro','Inter',system-ui,sans-serif;--font-body:'Inter',system-ui,-apple-system,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;--type-body-lg:400 18px/1.56 var(--font-body);--type-body-sm:400 14px/1.43 var(--font-body)}
body{margin:0;background:#000000}
a{color:#ffffff;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="min-height: 1080px; background: #000000; color: var(--ink); font-family: var(--font-body)">

  <dc-import name="StepNav" step="6" hint-size="100%,120px"></dc-import>

  <div style="display: flex; flex-direction: row-reverse; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 48px 64px; padding: 40px 48px 64px">
    <aside aria-label="Who acts on this screen" style="flex: 1 1 280px; max-width: 320px; display: flex; flex-direction: column; align-items: flex-end">
      <dc-import name="Role" role="borrower" who="Borrower A" action="Repays loan A in full" hint-size="320px,220px"></dc-import>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; max-width: 820px; display: flex; flex-direction: column; gap: 48px">

      <div style="display: flex; flex-wrap: wrap; gap: 32px 56px">
        <dc-import name="Value" label="Spending" amount="{{spending}}" visibility="decrypted" hint-size="240px,64px"></dc-import>
        <dc-import name="Value" label="Inbox" amount="{{inbox}}" visibility="decrypted" hint-size="240px,64px"></dc-import>
        <dc-import name="Value" label="Amount owed" amount="[amount owed A]" visibility="decrypted" hint-size="240px,64px"></dc-import>
        <dc-import name="Value" label="Payment" amount="[amount owed A]" visibility="decrypted" hint-size="240px,64px"></dc-import>
      </div>

      <section aria-labelledby="pay" style="display: flex; flex-direction: column; gap: 20px">
        <h2 id="pay" style="margin: 0; font: 500 20px/1.4 var(--font-display)">Repay in full</h2>
        <ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{steps}}" as="s" hint-placeholder-count="2">
            <li style="display: flex; flex-direction: column; gap: 10px"><span style="{{s.bar}}"></span><span style="font: 500 16px/1.3 var(--font-body)">{{s.name}}</span><span style="font: var(--type-body-sm); color: var(--mute)">{{s.note}}</span></li>
          </sc-for>
        </ol>
        <button type="button" onClick="{{advance}}" style="align-self: flex-start; min-height: 52px; padding: 0 28px; border: 0; border-radius: 9999px; background: #ffffff; color: #000000; font: 600 16px/1 var(--font-body); letter-spacing: 0.24px; cursor: pointer">{{cta}}</button>
      </section>

      <a href="07-settle.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 9999px; border: 1px solid var(--rule-strong); font: 500 14px/1 var(--font-body)">Continue to step 7</a>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const stage = (this.state && this.state.stage) || 0;
    const defs = [
      ['Merge the inbox', 'Inbox into spending'],
      ['Pay the amount owed', 'Full payment, exactly the amount owed. Broker and Loan Auditor receive it.']
    ];
    const steps = defs.map(([name, note], i) => ({
      name, note,
      bar: 'height: 3px; background: ' + (stage > i + 1 ? '#ffffff' : stage === i + 1 ? 'rgba(255,255,255,0.48)' : 'rgba(255,255,255,0.16)')
    }));
    const ctas = ['Repay loan A', 'Merging the inbox', 'Paying loan A', 'Repaid. Run it again'];
    return {
      steps,
      spending: stage > 2 ? '[after repayment]' : stage > 0 ? '[spending + inbox]' : '[spending A]',
      inbox: stage > 0 ? '0' : '[principal A]',
      cta: ctas[stage],
      advance: () => this.setState({ stage: stage < 3 ? stage + 1 : 0 })
    };
  }
}
</script>
</body>
</html>
