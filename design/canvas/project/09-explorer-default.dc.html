<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 9: Explorer, after default</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--ink:#ffffff;--mute:rgba(255,255,255,0.72);--dim:rgba(255,255,255,0.56);--rule:rgba(255,255,255,0.12);--rule-strong:rgba(255,255,255,0.32);--key:#627eea;--bar:#5c5e60;--loss:#e5484d;--font-display:'General Sans','Aeonik Pro','Inter',system-ui,sans-serif;--font-body:'Inter',system-ui,-apple-system,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;--type-body-lg:400 18px/1.56 var(--font-body);--type-body-sm:400 14px/1.43 var(--font-body)}
body{margin:0;background:#000000}
a{color:#ffffff;text-decoration:none}a:hover{color:#ffffff}
@keyframes zReveal{from{opacity:0;transform:translateY(6px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.001ms !important;animation-delay:0ms !important}}
</style>
</helmet>
<div style="min-height: 1080px; background: #000000; color: var(--ink); font-family: var(--font-body)">

  <dc-import name="StepNav" step="9" hint-size="100%,120px"></dc-import>

  <div style="display: flex; flex-direction: row-reverse; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 48px 64px; padding: 40px 48px 64px">
    <aside aria-label="Role and view" style="flex: 1 1 280px; max-width: 320px; display: flex; flex-direction: column; align-items: flex-end; gap: 32px">
      <dc-import name="Role" role="explorer" who="Explorer" action="Reads the ledger after the default" hint-size="320px,220px"></dc-import>
      <div role="group" aria-label="Read the ledger as" style="display: inline-flex; padding: 4px; border-radius: 9999px; border: 1px solid var(--rule-strong)">
        <button type="button" aria-pressed="{{isOutsider}}" onClick="{{showOutsider}}" style="{{tabOutsider}}">Outsider</button>
        <button type="button" aria-pressed="{{isAuditor}}" onClick="{{showAuditor}}" style="{{tabAuditor}}">Auditor</button>
      </div>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; max-width: 820px; display: flex; flex-direction: column; gap: 40px">
      <section aria-label="Transactions since step 5" style="overflow-x: auto">
        <div style="min-width: 720px; display: flex; flex-direction: column">
          <div style="display: grid; grid-template-columns: 40px 1.5fr 1.2fr 1.5fr 1fr; gap: 16px; padding-bottom: 12px; font: var(--type-body-sm); color: var(--dim)">
            <span>Step</span><span>Transaction</span><span>Signed by</span><span>Amount</span><span>Hash</span>
          </div>
          <sc-for list="{{rows}}" as="row" hint-placeholder-count="6">
            <div style="display: grid; grid-template-columns: 40px 1.5fr 1.2fr 1.5fr 1fr; gap: 16px; align-items: center; min-height: 60px; border-top: 1px solid var(--rule)">
              <span style="font: 500 14px/1 var(--font-body); color: var(--mute)">{{row.step}}</span>
              <span style="font: 500 15px/1.3 var(--font-body)">{{row.type}}</span>
              <span style="font: var(--type-body-sm); color: var(--mute)">{{row.role}}</span>
              <span>
                <sc-if value="{{row.hasAmount}}" hint-placeholder-val="{{ true }}">
                  <dc-import name="Value" label="" amount="{{row.amount}}" visibility="{{row.vis}}" hint-size="240px,40px"></dc-import>
                </sc-if>
                <sc-if value="{{row.isFlag}}" hint-placeholder-val="{{ false }}">
                  <span style="font: 500 15px/1.3 var(--font-body); color: var(--loss)">{{row.flag}}</span>
                </sc-if>
                <sc-if value="{{row.isNone}}" hint-placeholder-val="{{ false }}">
                  <span style="font: var(--type-body-sm); color: var(--dim)">No amount</span>
                </sc-if>
              </span>
              <span style="font: 400 13px/1 var(--font-mono); color: var(--dim)">[hash]</span>
            </div>
          </sc-for>
          <a href="05-explorer-loans.dc.html" style="display: flex; align-items: center; min-height: 52px; border-top: 1px solid var(--rule); font: var(--type-body-sm); color: var(--mute)">Earlier transactions on step 5</a>
        </div>
      </section>

      <section aria-label="Position after the default" style="display: flex; flex-wrap: wrap; gap: 24px 48px; padding-top: 24px; border-top: 1px solid var(--rule)">
        <sc-for list="{{totals}}" as="t" hint-placeholder-count="3">
          <dc-import name="Value" label="{{t.label}}" amount="{{t.amount}}" visibility="{{t.vis}}" hint-size="240px,64px"></dc-import>
        </sc-for>
      </section>

      <a href="10-redeem.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 9999px; border: 1px solid var(--rule-strong); font: 500 14px/1 var(--font-body)">Continue to step 10</a>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const auditor = (this.state && this.state.view) === 'auditor';
    const base = 'display: inline-flex; align-items: center; min-height: 36px; padding: 0 16px; border: 0; border-radius: 9999px; cursor: pointer; ';
    const on = base + 'background: #ffffff; color: #000000; font: 600 14px/1 var(--font-body)';
    const off = base + 'background: transparent; color: rgba(255,255,255,0.72); font: 500 14px/1 var(--font-body)';
    const enc = auditor ? 'decrypted' : 'redacted';
    const rows = [
      ['6', 'ConfidentialMPTMergeInbox', 'Borrower A', 'none', '', ''],
      ['6', 'ConfidentialLoanPay', 'Borrower A', 'amount', '[paid A]', enc],
      ['7', 'LoanBrokerMergeInbox', 'Broker A', 'none', '', ''],
      ['7', 'LoanBrokerSettle', 'Broker A', 'amount', '[settled]', 'public'],
      ['8', 'LoanManage, loan B', 'Broker A', 'flag', '', 'Impaired'],
      ['8', 'LoanManage, loan B', 'Broker A', 'flag', '', 'Defaulted']
    ].map(([step, type, role, kind, amount, extra]) => ({
      step, type, role, amount,
      vis: kind === 'amount' ? extra : 'public',
      flag: kind === 'flag' ? extra : '',
      hasAmount: kind === 'amount',
      isFlag: kind === 'flag',
      isNone: kind === 'none'
    }));
    const totals = [
      { label: 'Loan A repaid', amount: '[paid A]', vis: enc },
      { label: 'Settled', amount: '[settled]', vis: 'public' },
      { label: 'Loan B amount owed', amount: '[owed B]', vis: enc }
    ];
    return {
      rows,
      totals,
      isOutsider: auditor ? 'false' : 'true',
      isAuditor: auditor ? 'true' : 'false',
      tabOutsider: auditor ? off : on,
      tabAuditor: auditor ? on : off,
      showOutsider: () => this.setState({ view: 'outsider' }),
      showAuditor: () => this.setState({ view: 'auditor' })
    };
  }
}
</script>
</body>
</html>
